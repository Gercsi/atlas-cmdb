# Atlas CMDB virtual host for a local Apache 2.4 installation.
# Add this line to C:/Apache24/conf/httpd.conf:
# Include "C:/Apache24/conf/extra/atlas-cmdb.conf"
#
# PHP must already be configured globally through mod_php or FastCGI.

<VirtualHost *:80>
    ServerName atlas-cmdb.local
    DocumentRoot "C:/Apache24/htdocs/atlas/public"
    DirectoryIndex index.html

    SetEnv CMDB_CONFIG "C:/Apache24/Atlas-cmdb-private/config.json"
    # Távoli tesztnél add meg a tényleges DNS-nevet; több érték vesszővel választható el.
    SetEnv CMDB_ALLOWED_HOSTS "atlas-cmdb.local"
    # Távoli eléréshez állítsd 1-re, és lent használd: Require all granted.
    SetEnv CMDB_ALLOW_REMOTE "0"

    <Directory "C:/Apache24/htdocs/atlas/public">
        Options -Indexes
        AllowOverride All
        Require local
    </Directory>

    ErrorLog "C:/Apache24/logs/atlas-cmdb-error.log"
    CustomLog "C:/Apache24/logs/atlas-cmdb-access.log" combined
</VirtualHost>
